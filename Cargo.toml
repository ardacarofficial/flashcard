[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]
# The plugin SDK and example plugins build for wasm32 with their own workspace and lock file.
exclude = ["plugins-sdk"]

[workspace.package]
version = "1.4.2"
edition = "2021"
rust-version = "1.86"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# internal
fc-core = { path = "crates/fc-core" }
fc-api = { path = "crates/fc-api" }
fc-storage = { path = "crates/fc-storage" }
fc-providers = { path = "crates/fc-providers" }
fc-app = { path = "crates/fc-app" }
fc-interop = { path = "crates/fc-interop" }
fc-ai = { path = "crates/fc-ai" }
fc-plugins = { path = "crates/fc-plugins" }
fc-system-tts = { path = "crates/fc-system-tts" }

# external
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", default-features = false, features = ["std", "serde"] }
ts-rs = { version = "12", features = ["serde-json-impl", "uuid-impl", "no-serde-warnings"] }
rusqlite = { version = "0.43", features = ["bundled"] }
async-trait = "0.1"
getrandom = "0.3"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
ammonia = "4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
sha2 = "0.10"
base64 = "0.22"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = { version = "0.14", default-features = false }
sha1 = "0.10"
encoding_rs = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"

[profile.dev.package."*"]
opt-level = 1

# Smaller target dirs: line tables keep backtraces and panics readable (file:line) without
# full variable debug info. Incremental stays on (the default for these profiles).
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.test]
debug = "line-tables-only"
incremental = true

[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# internal
fc-core = { path = "crates/fc-core" }
fc-api = { path = "crates/fc-api" }
fc-storage = { path = "crates/fc-storage" }
fc-providers = { path = "crates/fc-providers" }
fc-app = { path = "crates/fc-app" }
fc-interop = { path = "crates/fc-interop" }

# external
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", default-features = false, features = ["std", "serde"] }
ts-rs = { version = "12", features = ["serde-json-impl", "uuid-impl", "no-serde-warnings"] }
rusqlite = { version = "0.43", features = ["bundled"] }
async-trait = "0.1"
getrandom = "0.3"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = { version = "0.14", default-features = false }
sha1 = "0.10"
sha2 = "0.10"
encoding_rs = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"

[profile.dev.package."*"]
opt-level = 1

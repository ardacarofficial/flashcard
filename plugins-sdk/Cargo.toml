# Plugin SDK and example plugins. Its own workspace: everything here builds for
# `wasm32-unknown-unknown` (`cargo build --release --target wasm32-unknown-unknown`).
[workspace]
resolver = "2"
members = ["rust", "examples/*"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
fc-plugin-sdk = { path = "rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

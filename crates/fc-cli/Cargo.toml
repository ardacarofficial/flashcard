[package]
name = "fc-cli"
description = "Command-line client for Flashcard; proves the core runs without Tauri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "fc"
path = "src/main.rs"

[dependencies]
fc-api.workspace = true
fc-core.workspace = true
fc-app = { path = "../fc-app" }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true

[dev-dependencies]
fc-app = { path = "../fc-app", features = ["testing"] }

[lints]
workspace = true

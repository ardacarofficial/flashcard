[package]
name = "fc-mcp"
description = "MCP server (stdio) exposing the curated Flashcard tool catalog, and an MCP client skeleton for external servers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fc-api.workspace = true
fc-app = { path = "../fc-app" }
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-std", "process"] }
rmcp = { version = "3.11", default-features = false, features = [
    "server",
    "client",
    "transport-io",
    "transport-child-process",
] }

[dev-dependencies]
fc-app = { path = "../fc-app", features = ["testing"] }
fc-core.workspace = true
tempfile.workspace = true
uuid.workspace = true

[lints]
workspace = true

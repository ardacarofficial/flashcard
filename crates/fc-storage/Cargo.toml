[package]
name = "fc-storage"
description = "SQLite storage: schema, migrations and the repository/transaction interface used by fc-app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fc-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
rusqlite = { workspace = true, features = ["functions", "hooks"] }
regex = { version = "1", default-features = false, features = ["std", "unicode"] }

[features]
## Kill-test hooks (`crash_points`): abort the process inside a write transaction. Tests only.
crash-points = []

[dev-dependencies]
tempfile.workspace = true
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true

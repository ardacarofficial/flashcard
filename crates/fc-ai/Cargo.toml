[package]
name = "fc-ai"
description = "AI provider adapters (Anthropic Claude, OpenAI, OpenAI-compatible, Ollama) over HTTP, the OS keychain for API keys, and a mock HTTP server for tests. Implements fc-providers' `AiProvider`; no business logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
## OS keychain (Windows Credential Manager, macOS Keychain, Linux kernel keyring) for API keys.
keychain = ["dep:keyring"]
## A local mock HTTP server for provider tests in other crates (`fc_ai::mock`).
mock = []

[dependencies]
fc-providers.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
base64.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls"] }
keyring = { version = "3.6", optional = true, features = ["apple-native", "windows-native", "linux-native"] }

[lints]
workspace = true

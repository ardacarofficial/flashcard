[package]
name = "fc-app"
description = "Service layer: command/query dispatch, registry, oplog/undo, events, jobs, modules, settings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fc-core.workspace = true
fc-api.workspace = true
fc-storage.workspace = true
fc-providers.workspace = true
fc-study = { path = "../fc-study" }
fc-interop.workspace = true
fc-ai.workspace = true
fc-plugins.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
getrandom.workspace = true
uuid.workspace = true
base64.workspace = true
# App lock (v1.0): Argon2id hashes of the PIN/password; salt from `getrandom`.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
# Unpredictable temporary folders for ffmpeg output (reading clips); also the test SQLite.
tempfile.workspace = true
# v1.0 maintenance: the `log` facade (the desktop app's file log is its backend) and the
# exported log bundle.
log = { version = "0.4", features = ["std"] }
zip.workspace = true

[dev-dependencies]
# Integration tests use `fc_app::testing`.
fc-app = { path = ".", features = ["testing"] }
# Kill tests abort a child process inside a write transaction (v1.4.1 H2).
fc-storage = { workspace = true, features = ["crash-points"] }
fc-plugins = { workspace = true, features = ["testing"] }
fc-interop = { workspace = true, features = ["fixtures"] }
fc-ai = { workspace = true, features = ["mock"] }
# Verifies a tampered signature against the real update key (same crate the updater uses).
minisign-verify = "0.3"
# v1.4.1: "any preset that validates can schedule any card state".
proptest = { version = "1", default-features = false, features = ["std"] }

[features]
## In-memory store, a temp-file SQLite store and the storage-agnostic service test suite
## (`fc_app::testing`).
testing = []

[lints]
workspace = true


<title>Taslak · Ekle, Kelimelerim, İlerleme (v1.4 D3)</title>
<style>
/* Tokens: docs/11-tasarim.md §4.1 (same values as apps/desktop/src/lib/theme/tokens.css). */
:root, :root[data-theme="dark"] {

  --success:#3DD68C; --success-soft:rgba(61,214,140,.14);
  --danger:#FF6369; --danger-soft:rgba(255,99,105,.14);
  --warning:#FF9D4D; --warning-soft:rgba(255,157,77,.14);

  --shadow-float:0 8px 28px rgba(0,0,0,.45);
}
:root[data-theme="light"] {
  color-scheme: light;
  --surface-0:#FAFAF8; --surface-1:#FFFFFF; --surface-2:#F3F3F0; --surface-3:#E9E9E4;
  --border:#E2E2DC; --border-strong:#CFCFC7;
  --text-1:#1A1A1C; --text-2:#5C5C63; --text-3:#85858C;
  --accent:#F5B544; --accent-fg:#17130A; --accent-text:#9A5B00; --accent-soft:rgba(245,181,68,.18);
  --focus-ring:#9A5B00;
  --success:#147A4B; --success-soft:rgba(20,122,75,.12);
  --danger:#C8323B; --danger-soft:rgba(200,50,59,.10);
  --warning:#B4520A; --warning-soft:rgba(180,82,10,.12);
  --neutral-dot:#85858C;
  --shadow-float:0 8px 28px rgba(0,0,0,.14);
}
:root {
  --font: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;

* { box-sizing: border-box; }

/* ------------------------------------------------ prototype bar (not part of the app) */
#proto { position:fixed; inset:0 0 auto 0; min-height:var(--proto-h); z-index:50; display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; padding:6px 12px;
  background:repeating-linear-gradient(135deg, var(--surface-1) 0 10px, var(--surface-2) 10px 20px); border-bottom:1px dashed var(--border-strong); font-size:12px; }

/* ------------------------------------------------ app shell */

/* ------------------------------------------------ controls */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:32px; padding:0 12px; border-radius:var(--r-ctl); border:1px solid var(--border-strong); background:var(--surface-2); color:var(--text-1); cursor:pointer; white-space:nowrap; font-weight:500; transition:background var(--motion); }

.field { display:flex; flex-direction:column; gap:5px; min-width:0; }

.chip { display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 10px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--text-2); cursor:pointer; white-space:nowrap; font-size:12px; }

.dot { width:7px; height:7px; border-radius:50%; display:inline-block; flex:none; }

.st.susp .dot { background:transparent; border:1.5px solid var(--neutral-dot); }
.pill { font-size:11px; padding:1px 7px; border-radius:999px; border:1px solid var(--border); color:var(--text-2); white-space:nowrap; }
.switch { position:relative; width:30px; height:18px; border-radius:999px; background:var(--surface-3); border:1px solid var(--border-strong); cursor:pointer; flex:none; padding:0; }

.panel { border:1px solid var(--border); border-radius:var(--r-panel); background:var(--surface-1); }

.row-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

.link { background:none; border:0; padding:0; color:var(--accent-text); cursor:pointer; font-weight:500; display:inline-flex; align-items:center; gap:4px; }

.adv-mark { font-size:10.5px; font-family:var(--mono); color:var(--accent-text); border:1px solid var(--accent-soft); background:var(--accent-soft); padding:0 5px; border-radius:3px; margin-left:6px; vertical-align:1px; white-space:nowrap; }

/* ------------------------------------------------ Kelimelerim */
.toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
.bigsearch { flex:1; min-width:240px; display:flex; align-items:center; gap:8px; height:36px; padding:0 10px; border:1px solid var(--border-strong); border-radius:var(--r-ctl); background:var(--surface-2); }

.filters { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
.filters .sp { flex:1; }
.deckstrip { display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--border); border-radius:var(--r-panel); background:var(--surface-1); margin-bottom:12px; flex-wrap:wrap; }

.wl { border:1px solid var(--border); border-radius:var(--r-panel); background:var(--surface-1); overflow:hidden; }

.wl-head { color:var(--text-2); font-size:12px; border-bottom:1px solid var(--border); background:var(--surface-1); position:sticky; top:0; }

.cb { width:15px; height:15px; accent-color:var(--accent); cursor:pointer; margin:0; }

.keys { display:inline-flex; gap:10px; flex-wrap:wrap; }
.keys kbd { font-size:10.5px; border:1px solid var(--border-strong); border-radius:3px; padding:0 4px; color:var(--text-2); margin-right:3px; }
.bulk { display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:6px 8px; border:1px solid var(--accent-soft); background:var(--accent-soft); border-radius:var(--r-panel); margin-bottom:10px; }
.bulk b { margin-right:6px; }
.detail { width:360px; flex:none; position:sticky; top:0; max-height:calc(100vh - var(--proto-h) - 44px - 48px); overflow:auto; }

.menu { position:absolute; z-index:30; min-width:240px; background:var(--surface-1); border:1px solid var(--border-strong); border-radius:var(--r-panel); box-shadow:var(--shadow-float); padding:4px; }
.menu button { display:flex; align-items:center; gap:10px; width:100%; border:0; background:transparent; padding:7px 10px; border-radius:var(--r-ctl); cursor:pointer; text-align:left; color:var(--text-1); }

      const v = m[2].replace(/"/g, '');
      if (m[1] === 'deck') ok = deckName(w.deck).toLowerCase().includes(v);
      else if (m[1] === 'is') ok = v === 'due' ? w.st !== 'new' && w.due <= 0 : v === 'new' ? w.st === 'new' : v === 'known' ? w.st === 'known' : v === 'learning' ? w.st === 'learning' : v === 'kenarda' ? w.susp : false;

      else ok = (w.src || '').toLowerCase().includes(v);
    } else {
      const s = t.replace(/"/g, '');
      ok = [w.term, w.mean, w.ex, w.src, deckName(w.deck)].some((f) => (f || '').toLowerCase().includes(s));

function detailHtml(w) {

  else if (w.manual) say = 'Bunu bildiğini sen söyledin; sorulmayacak. İstersen “Yeniden öğren”.';
  else say = `Biliyorsun: ${n(w.ivl)} gündür aklında. <b>${dueText(w.due)}</b> kontrol için bir kez sorulacak.`;
  const hist = S.adv && w.reps ? `<section><div class="lab">Tekrar geçmişi</div><table class="minitable"><thead><tr><th>Ne zaman</th><th>Cevap</th><th class="r">Sonraki</th></tr></thead><tbody>

function ansToday() {

  return `<section class="ans" aria-labelledby="q1"><div class="q" id="q1">Bugün ne yaptım?</div>

function ansGrowing() {
  const days = S.range;
  const s = knownSeries(days);
  const now = s[s.length - 1], then = s[0];
  const ranges = `<span class="sp"></span><span class="seg sm" role="group" aria-label="Dönem">${[[30, '30 g'], [90, '90 g'], [365, '1 yıl']].map(([v, l]) => `<button data-act="range" data-v="${v}" aria-pressed="${S.range === v}">${l}</button>`).join('')}</span>`;
  if (!now) return `<section class="ans" aria-labelledby="q2"><div class="q" id="q2">İlerliyor muyum?${ranges}</div><div class="say">Henüz “biliyorum” dediğin kelime yok.</div><div class="sub">Bir kelime, üç hafta sonra hâlâ hatırladığında “biliyorum” sayılır. İlk kelimelerin birkaç hafta içinde burada yükselmeye başlar.</div><div class="chartbox">${lineChart(new Array(10).fill(0), 'Bildiğin kelime sayısı: henüz yok')}</div><div class="foot"><span class="muted">Bildiklerini kendin işaretleyebilirsin: Kelimelerim › kelime › “Zaten biliyorum”.</span></div></section>`;
  const diff = now - then;
  const span = days === 365 ? '1 yıl' : `${days} gün`;
  return `<section class="ans" aria-labelledby="q2"><div class="q" id="q2">İlerliyor muyum?${ranges}</div>
    <div class="say">${diff > 0 ? 'Evet.' : 'Yerinde sayıyorsun.'} ${n(now)} kelimeyi biliyorsun; ${span} önce ${then ? `${n(then)} taneydi` : 'hiç yoktu'}${diff > 0 ? ` (<span class="hl num">+${diff}</span>)` : ''}.</div>
    <div class="sub">${n(counts().learning)} kelimeyi de öğreniyorsun; onlar oturdukça çizgi yükselir.</div>
    <div class="chartbox">${lineChart(s, `Bildiğin kelime sayısı, son ${span}: ${then} → ${now}`)}<div class="axis"><span>${span} önce</span><span>bugün</span></div></div>
    <div class="foot"><span class="muted">Biliyorum = üç hafta sonra hâlâ hatırladığın ya da “zaten biliyorum” dediğin kelime.</span></div></section>`;
}
function ansTomorrow() {

  const peakI = next7.indexOf(Math.max(...next7));

    <div class="sub">${n(tomorrow)} tekrar + ${n(newPerDay)} yeni. ${peakI === 0 ? 'Bu haftanın en yoğun günü yarın.' : `Bu hafta en yoğun gün ${DOW_LONG[(TODAY.getDay() + peakI + 1) % 7]}: ${n(next7[peakI])} tekrar.`}</div>

}
function moreGrid() {
  if (!db().studied) return `<div class="empty"><h3>Burada henüz anlatacak bir şey yok</h3><p>Birkaç gün çalıştıktan sonra çalışma takvimin, hatırlama oranın ve kelimelerinin aşamaları burada görünür.</p></div>`;
  const mp = (title, why, body, wide) => `<section class="mp ${wide ? 'wide' : ''}"><h3>${title}</h3><p class="why">${why}</p>${body}</section>`;
  // heatmap: 26 weeks
  let seed = 7; const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  const cells = Array.from({ length: 52 * 7 }, (_, i) => { const r = rnd(); const recent = i > 52 * 7 - 60; return !recent && r < 0.55 ? 0 : r < 0.2 ? 0 : r < 0.45 ? 1 : r < 0.7 ? 2 : r < 0.9 ? 3 : 4; });
  const heat = `<div class="heat" role="img" aria-label="Son 52 hafta, gün başına çalışma yoğunluğu">${cells.map((l) => `<i class="${l ? 'l' + l : ''}"></i>`).join('')}</div><div class="legend"><span>Az</span>${[0, 1, 2, 3, 4].map((l) => `<span class="sw" style="background:${l ? `var(--accent);opacity:${0.25 + l * 0.18}` : 'var(--surface-3)'}"></span>`).join('')}<span>Çok</span><span style="flex:1"></span><span>Son 60 günün <span class="num">47</span> gününde çalıştın</span></div>`;
  const ret = [82, 85, 88, 84, 90, 91, 89, 92];
  const c = counts();
  const tot = Math.max(1, c.all);
  const stages = `<div class="stack" role="img" aria-label="Yeni ${c.new}, öğreniyorum ${c.learning}, biliyorum ${c.known}"><i style="width:${(c.new / tot) * 100}%;background:var(--neutral-dot)"></i><i style="width:${(c.learning / tot) * 100}%;background:var(--warning)"></i><i style="width:${(c.known / tot) * 100}%;background:var(--success)"></i></div>
    <div class="legend"><span class="st new"><span class="dot"></span>Yeni ${n(c.new)}</span><span class="st learning"><span class="dot"></span>Öğreniyorum ${n(c.learning)}</span><span class="st known"><span class="dot"></span>Biliyorum ${n(c.known)}</span>${c.susp ? `<span class="st susp"><span class="dot"></span>Kenarda ${n(c.susp)}</span>` : ''}</div>`;
  const buckets = [['1 g', 0, 1], ['2–3', 2, 3], ['4–7', 4, 7], ['8–14', 8, 14], ['15–30', 15, 30], ['1–3 ay', 31, 90], ['3+ ay', 91, 9999]];
  const iv = buckets.map(([, a, b]) => live().filter((w) => w.st !== 'new' && w.ivl >= a && w.ivl <= b).length);
  const f30 = dueByDay(30);
  const hours = [0, 0, 0, 0, 0, 0, 0, 78, 81, 85, 0, 0, 88, 86, 0, 0, 0, 84, 90, 92, 89, 83, 76, 0];
  const leeches = live().filter((w) => w.lapses >= 3).sort((a, b) => b.lapses - a.lapses);
  const times = [3, 9, 7, 4, 2, 1];
  let out = mp('Çalışma takvimi', 'Her kare bir gün. Renk koyulaştıkça o gün daha çok kelime çalışmışsın; boş kareler ara verdiğin günler.', heat, true)
    + mp('Hatırlama oranı', 'Sırası gelen kelimelerin yüzde kaçını hatırladın, hafta hafta. %85–95 arası sağlıklı; çok düşerse yeni kelimeyi azalt.', `${bars(ret, { labels: ret.map((_, i) => (i === 7 ? 'bu hafta' : new Intl.DateTimeFormat('tr-TR', { day: 'numeric', month: 'short' }).format(new Date(TODAY.getTime() - (7 - i) * 7 * 864e5)))), on: 7, label: 'Haftalık hatırlama oranı: ' + ret.join(', ') })}`)
    + mp('Kelimelerin hangi aşamada', 'Her kelime yeni → öğreniyorum → biliyorum yolundan geçer. Yeşil büyüdükçe kelime dağarcığın büyüyor.', stages)
    + mp('Ne kadar süre aklında kalıyor', 'Bir kelimeyi bir sonraki görüşüne kadar kaç gün var. Çubuklar sağa kaydıkça kelimeler oturuyor.', bars(iv, { labels: buckets.map((b) => b[0]), label: 'Tekrar aralıkları: ' + iv.join(', ') }))
    + mp('Önümüzdeki 30 gün', 'Hangi gün kaç kelimenin sırası gelecek. Gecikenler bugüne sayılır; yeni kelimeler dahil değil.', bars(f30, { values: false, on: 0, label: '30 günlük tahmin: ' + f30.join(', ') }) + '<div class="axis"><span>bugün</span><span>+10 gün</span><span>+20 gün</span><span>+30 gün</span></div>')
    + mp('Günün hangi saatinde', 'Saatlere göre doğru cevap oranın. Akşam 18–20 arası en iyi saatlerin gibi duruyor.', bars(hours.slice(7, 23), { values: false, on: 12, label: 'Saat başına doğru oranı, 07–22: ' + hours.slice(7, 23).join(', ') }) + '<div class="axis"><span>07:00</span><span>12:00</span><span>17:00</span><span>22:00</span></div>')
    + mp('Sürekli unuttukların', 'Üç ya da daha çok kez unuttuğun kelimeler. Cümlesini yeniden oku, anlamını netleştir ya da bir süre kenara koy.', leeches.length ? `<table class="minitable"><thead><tr><th>Kelime</th><th>Anlamı</th><th class="r">Unuttun</th></tr></thead><tbody>${leeches.map((w) => `<tr><td><button class="link" data-act="openword" data-id="${w.id}">${esc(w.term)}</button></td><td>${esc(w.mean)}</td><td class="r num">${w.lapses} kez</td></tr>`).join('')}</tbody></table><div class="row-actions" style="margin-top:10px"><button class="btn sm" data-act="study">${ic('play')}Bunları çalış · ${leeches.length}</button></div>` : '<p class="muted">Sürekli unuttuğun kelime yok.</p>')
    + mp('Cevap süren', 'Bir kelimeye cevap vermen kaç saniye sürüyor. Uzun süreler çoğu zaman “emin değilim” demek.', `${bars(times, { labels: ['≤2 sn', '≤4', '≤6', '≤10', '≤20', '>20'], label: 'Cevap süreleri dağılımı' })}<p class="small muted" style="margin:8px 0 0">Ortalama <span class="num">6,2</span> sn</p>`)
    + mp('Deste karneleri', 'Her destede kaç kelimen var ve kaçını biliyorsun.', `<table class="minitable"><thead><tr><th>Deste</th><th class="r">Kelime</th><th class="r">Biliyorum</th></tr></thead><tbody>${DECKS.map((d) => { const ws = live().filter((w) => w.deck === d.id); const k = ws.filter((w) => w.st === 'known').length; return `<tr><td>${esc(d.name)}</td><td class="r num">${ws.length}</td><td class="r num">${k} · %${ws.length ? Math.round((k / ws.length) * 100) : 0}</td></tr>`; }).join('')}</tbody></table>`);
  if (S.adv) {
    out += mp('Stabilite ve zorluk <span class="adv-mark">Gelişmiş</span>', 'Zamanlayıcının (FSRS) her kelime için tuttuğu iki sayı: hatırlaman %90’a inene kadar kaç gün geçer ve kelime senin için ne kadar zor (1–10).', bars([4, 6, 5, 3, 2, 1], { labels: ['≤1g', '≤7', '≤21', '≤60', '≤180', '180+'], label: 'Stabilite dağılımı' }))
      + mp('Sınıflandırmaya göre <span class="adv-mark">Gelişmiş</span>', 'Etiket ya da seviye gibi bir sınıflandırmanın değerleri arasında ilerlemeyi karşılaştır.', `<table class="minitable"><thead><tr><th>Etiket</th><th class="r">Kelime</th><th class="r">Biliyorum</th></tr></thead><tbody><tr><td>fiil</td><td class="r num">${live().filter((w) => w.tags.includes('fiil')).length}</td><td class="r num">${live().filter((w) => w.tags.includes('fiil') && w.st === 'known').length}</td></tr><tr><td>(etiketsiz)</td><td class="r num">${live().filter((w) => !w.tags.length).length}</td><td class="r num">${live().filter((w) => !w.tags.length && w.st === 'known').length}</td></tr></tbody></table>`);

/* ----------------------------------------------------------------- render */
function page() {
  if (S.route === 'home') return pageHome();
  if (S.route === 'decks') return pageDecks();
  if (S.route === 'words') return pageWords();
  if (S.route === 'add') return pageAdd();
  if (S.route === 'progress') return pageProgress();
  return pageSettings();
}
let lastRoute = null;
function render() {
  const a = document.activeElement;
  const fid = a && a.id && a !== document.body ? a.id : null;
  let ss = null, se = null;
  try { if (a && typeof a.selectionStart === 'number') { ss = a.selectionStart; se = a.selectionEnd; } } catch { /* not a text field */ }
  document.documentElement.dataset.theme = S.theme;
  $('#proto').innerHTML = protoBar();
  document.documentElement.style.setProperty('--proto-h', $('#proto').offsetHeight + 'px');
  const keep = lastRoute === S.route ? ($('#page')?.scrollTop || 0) : 0;
  const sheetScroll = $('.sheet .sb')?.scrollTop || 0;
  $('#app').innerHTML = sidebar() + `<div class="main">${topbar()}<main class="page" id="page">${page()}</main></div>${sheetHtml()}`;
  $('#page').scrollTop = keep;
  if ($('.sheet .sb')) $('.sheet .sb').scrollTop = sheetScroll;
  lastRoute = S.route;
  const dr = $('#drawer');
  dr.classList.toggle('open', !!S.notes);
  dr.setAttribute('aria-hidden', String(!S.notes));
  if (S.notes) dr.innerHTML = notesHtml();
  if (fid) {
    const el = document.getElementById(fid);
    if (el) { el.focus({ preventScroll: true }); try { if (ss != null) el.setSelectionRange(ss, se); } catch { /* select */ } }
  }
  if (S.sel) document.getElementById('row-' + S.sel)?.scrollIntoView({ block: 'nearest' });
}
function focus(id) {
  // Synchronous when the element is already there (typing right after a key must land in it), else next frame.
  const go = () => { const el = document.getElementById(id); if (el) { el.focus(); try { el.select(); } catch { /* no select */ } } return !!el; };
  if (!go()) requestAnimationFrame(go);
}

/* ----------------------------------------------------------------- toast + undo */
let toastTimer = null;
function toast(msg, undo) {
  const box = $('#toast');
  box.innerHTML = `<div class="toast"><span>${msg}</span>${undo ? '<button class="link" data-act="undo">Geri al</button>' : ''}<button class="iconbtn" data-act="closetoast" aria-label="Kapat">${ic('x')}</button></div>`;
  toast.undo = undo || null;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.innerHTML = ''; toast.undo = null; }, 6000);
}

/* ----------------------------------------------------------------- mutations */
function addWord(o) {
  const w = { id: 'w' + uid++, term: o.term.trim(), mean: (o.mean || '').trim(), ex: (o.ex || '').trim(), exTr: '', src: (o.src || '').trim(), deck: o.deck && o.deck !== '__new' ? o.deck : 'me', st: 'new', due: 0, ivl: 0, lapses: 0, reps: 0, added: 0, knownSince: null, manual: false, susp: false, tags: o.tags ? o.tags.split(/[\s,]+/).filter(Boolean) : [] };
  db().words.unshift(w);
  return w;
}
function removeWords(ids) { ids.forEach((id) => { const w = db().words.find((x) => x.id === id); if (w) w.deleted = true; }); }

function addMany(list, deck, label) {
  const ws = list.map((o) => addWord({ ...o, deck }));
  const ids = ws.map((w) => w.id);
  toast(`${ws.length} kelime eklendi · ${esc(deckName(deck))}. <button class="link" data-act="go" data-r="words">Kelimelerim’de gör</button>`, () => removeWords(ids));
  return ws;
}
function moveSel(delta) {
  const l = filtered();
  if (!l.length) return;
  let i = l.findIndex((w) => w.id === S.sel);
  i = i < 0 ? (delta > 0 ? 0 : l.length - 1) : Math.min(l.length - 1, Math.max(0, i + delta));
  S.sel = l[i].id; S.edit = null;
  render();
}
function openAdd(term) {
  S.menu = null;

    S.route = 'add'; S.way = 'single'; S.sheet = null;
    if (term != null) S.form.term = term;
    render(); focus(term ? 'f-mean' : 'f-term');
  } else {
    S.route = 'words'; S.sheet = null;
    if (term) { S.inlineAdd = { term, mean: '', ex: '', src: '', deck: S.form.deck }; render(); focus('ia-mean'); }

}

  aipick(d, e) { e.stopPropagation(); const i = Number(d.i); S.ai.picked.has(i) ? S.ai.picked.delete(i) : S.ai.picked.add(i); },
  aiadd() { const list = [...S.ai.picked].map((i) => ({ term: AI_SUGG[i][0], mean: AI_SUGG[i][1], ex: AI_SUGG[i][2] })); addMany(list, S.aiDeck || 'bb'); S.ai = { topic: '', count: '10', state: 'idle', picked: new Set() }; },
  starter(d) { S.starters.add(d.id); toast(`“${esc(d.t)}” destesi eklendi. Kelimeleri Kelimelerim’de “${esc(d.t)}” süzgecinde (taslakta listeye eklenmedi).`, () => S.starters.delete(d.id)); },
  study() { toast('Çalışma başlatıcısı açılır (çalışma akışı D1 taslağında).'); return false; },
  toast(d) { S.menu = null; toast(esc(d.m)); },
  topsearch() { if (S.adv) { toast('Komut paleti açılır (v1.3’teki gibi: eylemler, ekranlar, komutlar).'); return false; } S.route = 'words'; S.sheet = null; render(); focus('q'); return false; },
  more() { S.more = !S.more; store.set('more', S.more); },
  range(d) { S.range = Number(d.v); },
  stattab(d) { S.statTab = d.t; S.route = 'progress'; },
  undo() { if (toast.undo) { toast.undo(); toast('Geri alındı.'); } },
  closetoast() { $('#toast').innerHTML = ''; return false; },
  tour(d) {
    S.notes = false; S.menu = null; S.sheet = null; S.edit = null; S.inlineAdd = null; S.formErr = '';
    if (S.data !== 'full' && d.t !== 't12') A.proto({ k: 'data', v: 'full' });
    const t = d.t;
    if (['t1', 't2', 't3', 't4', 't5', 't6', 't7'].includes(t) && S.add !== 'A') A.proto({ k: 'add', v: 'A' });
    if (t === 't1') { openAdd(); return false; }
    if (t === 't2') { S.route = 'add'; S.way = 'single'; S.form.term = 'reluctant'; render(); focus('f-term'); return false; }
    if (t === 't3') { openWay('inbox'); return false; }
    if (t === 't4') { S.route = 'add'; S.way = 'paste'; A.samplepaste(); }
    if (t === 't5') { S.route = 'add'; S.way = 'file'; S.file = 'friends-s1.csv'; }
    if (t === 't6') { S.route = 'add'; S.way = 'ai'; S.ai.topic = 'Breaking Bad’deki argo kelimeler'; }
    if (t === 't7') { S.route = 'add'; S.way = 'text'; }
    if (t === 't8') { S.route = 'words'; S.q = 'give'; S.status = 'all'; S.deck = 'all'; S.sel = (findTerm('give up') || {}).id; }
    if (t === 't9') { A.proto({ k: 'add', v: 'B' }); S.route = 'words'; S.q = 'resilient'; S.status = 'all'; S.sel = null; render(); focus('q'); return false; }
    if (t === 't10') { S.route = 'progress'; S.statTab = 'overview'; S.more = true; }
    if (t === 't11') { S.adv = true; store.set('adv', true); S.route = 'words'; S.q = ''; S.selIds = new Set([live()[0].id, live()[1].id]); S.sel = live()[2].id; }
    if (t === 't12') { A.proto({ k: 'data', v: 'empty' }); S.route = 'words'; }
  },
};

/* ----------------------------------------------------------------- events */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (S.menu && !e.target.closest('.menu')) { S.menu = null; render(); } return; }
  const act = el.dataset.act;
  if (el.dataset.stop) e.stopPropagation();
  if (act === 'deck' && e.target.closest('[data-act="study"]')) return;
  if (!A[act]) return;
  if (S.menu && act !== 'menu' && !el.closest('.menu')) S.menu = null;
  const r = A[act](el.dataset, e);
  if (r !== false) render();
});
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-bind]');
  if (!el) return;
  const path = el.dataset.bind; const v = el.value;
  if (path === 'q') { S.q = v; S.inlineAdd = null; S.formErr = ''; render(); return; }
  if (path.startsWith('inbox.')) { const [, id, k] = path.split('.'); const it = db().inbox.find((x) => x.id === id); if (it) it[k] = v; return; }
  const parts = path.split('.');
  let o = S; for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = v;
  if (path === 'form.term') { const box = $('#dupbox'); if (box) box.innerHTML = dupHtml(v && findTerm(v)); return; }
  if (el.dataset.live) render();
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('select[data-bind]');
  if (!el) return;
  const path = el.dataset.bind; const v = el.value;
  if (v === '__new') { toast('Yeni deste: adını sorar, sonra seçili olur (taslakta sorulmuyor).'); render(); return; }
  if (path === 'deck') { S.deck = v; S.sel = null; S.edit = null; render(); return; }
  if (path === 'bulkmove') { const ws = [...S.selIds].map((id) => live().find((w) => w.id === id)).filter(Boolean); const before = ws.map((w) => w.deck); ws.forEach((w) => (w.deck = v)); toast(`${ws.length} kelime “${esc(deckName(v))}” destesine taşındı.`, () => ws.forEach((w, i) => (w.deck = before[i]))); render(); return; }
  if (path.startsWith('inbox.')) { const [, id, k] = path.split('.'); const it = db().inbox.find((x) => x.id === id); if (it) it[k] = v; return; }
  const parts = path.split('.');
  let o = S; for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = v;
  if (path === 'knownAfter') toast(`“Biliyorum” artık ${v === '14' ? '2 hafta' : v === '30' ? '1 ay' : '3 hafta'} sonra. Kelimelerim, İlerleme ve Subtitle aynı sayıyı kullanır (taslakta örnek veri değişmez).`);
});
document.addEventListener('keydown', (e) => {
  const t = e.target;
  const typing = t.matches && t.matches('input, textarea, select');
  const mod = e.ctrlKey || e.metaKey;
  if (e.key === 'Escape') {
    if (S.menu) S.menu = null;
    else if (S.sheet) S.sheet = null;
    else if (S.edit) S.edit = null;
    else if (S.inlineAdd) { S.inlineAdd = null; S.formErr = ''; render(); focus('q'); return; }
    else if (t.id === 'q' && S.q) S.q = '';
    else if (S.sel) S.sel = null;
    else if (S.notes) S.notes = false;
    else return;
    e.preventDefault(); render(); return;
  }
  if (mod && e.key === 'Enter') {
    const id = t.id || '';
    if (id.startsWith('f-')) { e.preventDefault(); submitSingle(); }
    else if (id.startsWith('ia-') || (id === 'q' && S.inlineAdd)) { e.preventDefault(); submitInline(); }
    else if (id.startsWith('e-') && S.edit) { e.preventDefault(); saveEdit(S.edit); }
    else if (id === 'paste') { e.preventDefault(); A.addpaste(); render(); }
    return;
  }
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); A.topsearch(); return; }
  if (typing) {
    if (t.id === 'q') {
      if (e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); focus('q'); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); focus('q'); }
      else if (e.key === 'Enter' && !e.repeat) {
        e.preventDefault();
        const q = S.q.trim();
        if (S.add === 'B' && q && !findTerm(q) && !/:/.test(q)) { A.inlineadd(); return; }
        const l = filtered(); const w = l.find((x) => x.id === S.sel) || l[0];
        if (w) { S.sel = w.id; S.edit = w.id; render(); focus('e-mean'); }
      }
      return;
    }
    if (e.key === 'Enter' && !e.shiftKey && t.tagName === 'INPUT') {
      if (t.id === 'f-term') { e.preventDefault(); focus('f-mean'); }
      else if (['f-mean', 'f-ex', 'f-src'].includes(t.id)) { e.preventDefault(); submitSingle(); }
      else if (t.id === 'ia-term') { e.preventDefault(); focus('ia-mean'); }
      else if (t.id && t.id.startsWith('ia-')) { e.preventDefault(); submitInline(); }
    }
    return;
  }
  if (e.repeat || mod || e.altKey) return;
  if ((e.key === 'n' || e.key === 'N') && !S.sheet) { e.preventDefault(); openAdd(); return; }
  if (e.key === '/' && S.route === 'words') { e.preventDefault(); focus('q'); return; }
  if (S.route === 'words' && !S.sheet) {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); }
    else if (e.key === 'Enter' && S.sel && !S.edit && !t.closest('button')) { e.preventDefault(); A.edit({ id: S.sel }); }
    else if (e.key === ' ' && S.adv && S.sel && !t.closest('button')) { e.preventDefault(); S.selIds.has(S.sel) ? S.selIds.delete(S.sel) : S.selIds.add(S.sel); render(); }
  }
  if ((e.key === 'Enter' || e.key === ' ') && t.matches('[data-act="pick"], tr[data-act="deck"]')) { e.preventDefault(); t.click(); }
});
window.addEventListener('resize', () => document.documentElement.style.setProperty('--proto-h', $('#proto').offsetHeight + 'px'));
render();
</script>

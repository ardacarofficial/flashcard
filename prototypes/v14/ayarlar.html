<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayarlar · v1.4 taslak</title>
<style>
/* Tokens: apps/desktop/src/lib/theme/tokens.css (v1.2 design system), dark first. */
:root, :root[data-theme='dark'] {
  color-scheme: dark;
  --surface-0:#0e0e10; --surface-1:#151518; --surface-2:#1c1c20; --surface-3:#25252b;
  --border:#2a2a31; --border-strong:#3a3a43;
  --text-1:#ededef; --text-2:#a3a3ae; --text-3:#74747f;
  --accent:#f5b544; --accent-fg:#17130a; --accent-text:#f5b544;
  --accent-soft:color-mix(in srgb,#f5b544 14%,transparent);
  --selected:#342b1e;
  --success:#3dd68c; --success-soft:color-mix(in srgb,#3dd68c 10%,#151518);
  --warning:#ff9d4d; --warning-soft:color-mix(in srgb,#ff9d4d 12%,#151518);
  --danger:#ff6369; --danger-soft:color-mix(in srgb,#ff6369 10%,#151518);
  --backdrop:rgb(0 0 0 / .6);
  --shadow-float:0 12px 32px rgb(0 0 0 / .5),0 2px 6px rgb(0 0 0 / .35);
}
:root[data-theme='light'] {
  color-scheme: light;
  --surface-0:#fafaf8; --surface-1:#ffffff; --surface-2:#f3f3f0; --surface-3:#e9e9e4;
  --border:#e2e2dc; --border-strong:#cfcfc7;
  --text-1:#1a1a1c; --text-2:#5c5c63; --text-3:#85858c;
  --accent-text:#9a5b00; --selected:#fef5e5;
  --success:#147a4b; --success-soft:color-mix(in srgb,#147a4b 10%,#fff);
  --warning:#b4520a; --warning-soft:color-mix(in srgb,#ff9d4d 12%,#fff);
  --danger:#c8323b; --danger-soft:color-mix(in srgb,#c8323b 10%,#fff);
  --backdrop:rgb(20 20 24 / .32);
  --shadow-float:0 12px 32px rgb(0 0 0 / .14),0 2px 6px rgb(0 0 0 / .08);
}
:root {
  --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, monospace;
  --r-ctl:6px; --r-card:8px; --r-flash:12px; --r-pill:999px;
  --ctl-sm:28px; --ctl-md:32px; --row-h:34px;
  --motion:150ms; --ease:cubic-bezier(.16,1,.3,1);
}
* { box-sizing: border-box; }
html, body { margin:0; height:100%; }
body { background:var(--surface-0); color:var(--text-1); font:13px/1.45 var(--font-sans); -webkit-font-smoothing:antialiased; }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.num, .mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
.muted { color:var(--text-2); } .faint { color:var(--text-3); }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
svg.i { width:16px; height:16px; flex:none; stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
svg.i.s14 { width:14px; height:14px; }

/* ---------- prototype strip (not part of the app) ---------- */
.proto { position:fixed; inset:0 0 auto 0; height:30px; z-index:40; display:flex; align-items:center; gap:14px; padding:0 12px;
  background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,var(--surface-1) 10px 20px); border-bottom:1px dashed var(--border-strong); font-size:12px; color:var(--text-2); white-space:nowrap; overflow-x:auto; }
.proto b { color:var(--text-1); font-weight:600; }
.proto .ab { display:inline-flex; align-items:center; gap:6px; }
.proto .ab .seg button { min-height:0; height:20px; padding:0 8px; font-size:11px; flex-direction:row; }
.proto > * { flex:none; }
.proto .seg { flex-wrap:nowrap; }
@media (max-width:1180px) { .proto .desc { display:none; } }
.proto .sp { flex:1; }
.proto .pbtn { height:22px; padding:0 10px; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:var(--r-ctl); font-size:12px; }
.proto .pbtn { border-color:var(--accent); color:var(--text-1); }
.proto .pbtn.on { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }

/* ---------- app shell ---------- */
.app { position:fixed; inset:30px 0 0 0; display:grid; grid-template-columns:216px minmax(0,1fr); }
.appnav { background:var(--surface-1); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:12px 8px; gap:2px; min-height:0; }
.brand { display:flex; align-items:center; gap:8px; font-weight:600; padding:4px 10px 16px; }
.brand .logo { width:18px; height:18px; border-radius:4px; background:var(--accent); }
.nav-item { display:flex; align-items:center; gap:10px; height:30px; padding:0 10px; border-radius:var(--r-ctl); color:var(--text-2); border:0; background:none; text-align:left; width:100%; }
.nav-item:hover { background:var(--surface-2); color:var(--text-1); }
.nav-item.on { background:var(--surface-3); color:var(--text-1); box-shadow:inset 2px 0 0 var(--accent); }
.nav-item .cnt { margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--text-2); }
.appnav .grow { flex:1; }
.appnav hr { border:0; border-top:1px solid var(--border); margin:6px 2px; width:auto; }
.avatar { width:22px; height:22px; border-radius:50%; background:var(--surface-3); display:grid; place-items:center; font-size:10px; font-weight:600; color:var(--text-1); }
.main { display:grid; grid-template-rows:44px minmax(0,1fr); min-width:0; min-height:0; }
.topbar { display:flex; align-items:center; gap:12px; padding:0 16px 0 24px; border-bottom:1px solid var(--border); }
.crumb { display:flex; align-items:center; gap:6px; color:var(--text-2); min-width:0; white-space:nowrap; overflow:hidden; }
.crumb b { color:var(--text-1); font-weight:500; overflow:hidden; text-overflow:ellipsis; }
.topbar .sp { flex:1; }
.palette { display:flex; align-items:center; gap:8px; height:28px; width:280px; padding:0 6px 0 10px; border:1px solid var(--border); border-radius:var(--r-ctl); background:var(--surface-1); color:var(--text-3); }
.palette .sp { flex:1; }
kbd { font-family:var(--font-mono); font-size:11px; padding:1px 5px; border:1px solid var(--border-strong); border-bottom-width:2px; border-radius:4px; color:var(--text-2); background:var(--surface-2); }

/* ---------- settings area ---------- */
.settings { display:grid; grid-template-columns:260px minmax(0,1fr); min-height:0; }
.snav { border-right:1px solid var(--border); padding:16px 12px 12px; display:flex; flex-direction:column; gap:12px; min-height:0; overflow:auto; }
.search { position:relative; }
.search input { width:100%; height:32px; padding:0 30px 0 32px; border:1px solid var(--border); border-radius:var(--r-ctl); background:var(--surface-2); }
.search input::-webkit-search-cancel-button { display:none; }
.search input::placeholder { color:var(--text-3); }
.search > svg { position:absolute; left:10px; top:8px; color:var(--text-3); }
.search .clear { position:absolute; right:4px; top:4px; width:24px; height:24px; border:0; background:none; color:var(--text-3); border-radius:4px; display:none; }
.search.has .clear { display:grid; place-items:center; }
.results { display:flex; flex-direction:column; gap:1px; }
.results .rh { font-size:11px; color:var(--text-3); padding:2px 4px 4px; }
.res { display:block; text-align:left; width:100%; border:1px solid transparent; background:none; padding:6px 8px; border-radius:var(--r-ctl); }
.res:hover, .res.act { background:var(--surface-2); border-color:var(--border); }
.res .rl { color:var(--text-1); display:block; }
.res .rl mark { background:var(--accent-soft); color:inherit; border-radius:2px; }
.res .rp { color:var(--text-2); font-size:12px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:1px; }
.tag { display:inline-flex; align-items:center; gap:4px; height:18px; padding:0 6px; border-radius:var(--r-pill); font-size:11px; font-weight:500; border:1px solid var(--border-strong); color:var(--text-2); white-space:nowrap; }
.tag.adv { border-color:transparent; background:var(--surface-3); color:var(--text-1); }
.tag.rec { border-color:transparent; background:var(--accent-soft); color:var(--accent-text); }
.tag.ok { border-color:transparent; background:var(--success-soft); color:var(--success); }
.tag.off { border-color:transparent; background:var(--surface-3); color:var(--text-2); }
.tag.warn { border-color:transparent; background:var(--warning-soft); color:var(--warning); }
.tag.new { border-color:transparent; background:var(--accent); color:var(--accent-fg); }
.ngroup { display:flex; flex-direction:column; gap:1px; }
.ngroup h3 { margin:6px 0 4px; padding:0 8px; font-size:11px; font-weight:600; color:var(--text-2); text-transform:none; letter-spacing:.01em; }
.ngroup .hint { padding:0 8px 4px; font-size:11px; color:var(--text-3); margin:-2px 0 2px; }
.sitem { display:flex; align-items:center; gap:8px; min-height:30px; padding:4px 8px; border-radius:var(--r-ctl); border:0; background:none; color:var(--text-2); text-align:left; width:100%; }
.sitem:hover { background:var(--surface-2); color:var(--text-1); }
.sitem.on { background:var(--surface-3); color:var(--text-1); box-shadow:inset 2px 0 0 var(--accent); }
.sitem .q { display:block; font-size:11px; color:var(--text-3); line-height:1.3; }
.sitem.on .q { color:var(--text-2); }
.sitem .st { margin-left:auto; }
.dot { width:7px; height:7px; border-radius:50%; background:var(--text-3); flex:none; }
.dot.ok { background:var(--success); } .dot.off { background:var(--text-3); } .dot.warn { background:var(--warning); }
.advswitch { margin-top:auto; border-top:1px solid var(--border); padding:12px 4px 2px; display:flex; flex-direction:column; gap:6px; }
.advswitch .line { display:flex; align-items:center; justify-content:space-between; gap:8px; font-weight:500; }
.advswitch p { margin:0; font-size:12px; color:var(--text-2); }

.content { overflow:auto; min-width:0; scroll-behavior:smooth; }
.page { max-width:860px; padding:24px 32px 96px; }
.page-h { display:flex; align-items:flex-start; gap:16px; margin-bottom:20px; }
.page-h .t { flex:1; min-width:0; }
.page-h h1 { margin:0; font-size:20px; font-weight:600; line-height:1.3; }
.page-h p { margin:4px 0 0; color:var(--text-2); font-size:14px; max-width:62ch; }
.banner { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--border); border-radius:var(--r-card); background:var(--surface-1); margin-bottom:16px; }
.banner.adv { background:var(--surface-2); }
.banner.warn { background:var(--warning-soft); border-color:transparent; }
.banner.ok { background:var(--success-soft); border-color:transparent; }
.banner .bt { flex:1; }
.banner .bt b { display:block; font-weight:600; }
section.sec { margin:0 0 28px; }
section.sec > h2 { display:flex; align-items:center; gap:8px; margin:0 0 2px; font-size:14px; font-weight:600; }
section.sec > .sd { margin:0 0 8px; color:var(--text-2); max-width:66ch; }
.rows { border-top:1px solid var(--border); }
.rows { container-type:inline-size; }
.row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 24px; align-items:start; padding:12px 0; border-bottom:1px solid var(--border); }
.row.flash { animation:flash 1.6s var(--ease); }
@keyframes flash { 0%,40% { background:var(--accent-soft); box-shadow:-8px 0 0 var(--accent-soft),8px 0 0 var(--accent-soft); } 100% { background:transparent; } }
.row.stack { grid-template-columns:minmax(0,1fr); }
.rlabel { font-size:14px; font-weight:500; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.rdesc { margin:2px 0 0; color:var(--text-2); max-width:58ch; }
.effect { margin:6px 0 0; display:flex; gap:6px; align-items:flex-start; color:var(--text-1); max-width:60ch; }
.effect::before { content:'→'; color:var(--accent-text); font-weight:600; }
.effect.warn { color:var(--warning); } .effect.warn::before { content:'!'; color:var(--warning); }
.effect:empty { display:none; }
.ctl { display:flex; flex-direction:column; align-items:flex-end; gap:6px; justify-self:end; }
.row.stack .ctl { align-items:stretch; justify-self:stretch; }
.reset { border:0; background:none; color:var(--accent-text); font-size:12px; padding:0; }
.reset:hover { text-decoration:underline; }

/* controls */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:var(--ctl-md); padding:0 12px; border-radius:var(--r-ctl); border:1px solid var(--border-strong); background:var(--surface-2); color:var(--text-1); font-weight:500; white-space:nowrap; }
.btn:hover { background:var(--surface-3); }
.btn.primary { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
.btn.primary:hover { filter:brightness(.95); }
.btn.ghost { background:none; border-color:transparent; color:var(--text-2); }
.btn.ghost:hover { background:var(--surface-2); color:var(--text-1); }
.btn.danger { color:var(--danger); }
.btn.sm { height:var(--ctl-sm); padding:0 10px; font-size:12px; }
.btn:disabled { opacity:.55; cursor:default; }
.seg { display:inline-flex; padding:2px; gap:2px; border:1px solid var(--border); border-radius:var(--r-ctl); background:var(--surface-2); flex-wrap:wrap; }
.seg button { min-height:26px; padding:2px 10px; border:1px solid transparent; border-radius:4px; background:none; color:var(--text-2); display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.2; }
.seg button:hover { color:var(--text-1); }
.seg button[aria-checked='true'] { background:var(--surface-0); border-color:var(--border-strong); color:var(--text-1); font-weight:500; }
:root[data-theme='light'] .seg button[aria-checked='true'] { background:#fff; }
.seg small { font-size:10px; color:var(--accent-text); font-weight:500; }
.sw { position:relative; width:36px; height:20px; border-radius:999px; border:1px solid var(--border-strong); background:var(--surface-3); padding:0; flex:none; transition:background var(--motion); }
.sw::after { content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--text-2); transition:transform var(--motion) var(--ease), background var(--motion); }
.sw[aria-checked='true'] { background:var(--accent); border-color:var(--accent); }
.sw[aria-checked='true']::after { transform:translateX(16px); background:var(--accent-fg); }
.inp, select.inp, textarea.inp { height:var(--ctl-md); padding:0 10px; border:1px solid var(--border); border-radius:var(--r-ctl); background:var(--surface-2); min-width:0; }
textarea.inp { height:auto; padding:8px 10px; font-family:var(--font-mono); font-size:12px; line-height:1.5; width:100%; resize:vertical; }
.inp:focus { border-color:var(--accent); outline:none; box-shadow:0 0 0 2px var(--accent-soft); }
.inp.num { width:88px; text-align:right; }
.inp.wide { width:280px; }
.numwrap { display:inline-flex; align-items:center; gap:6px; }
.numwrap .unit { color:var(--text-2); font-size:12px; }
.quick { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
.quick button { display:flex; flex-direction:column; align-items:center; min-width:62px; padding:4px 8px; border:1px solid var(--border); border-radius:var(--r-ctl); background:var(--surface-2); line-height:1.25; }
.quick button b { font-family:var(--font-mono); font-size:14px; }
.quick button span { font-size:11px; color:var(--text-2); }
.quick button[aria-pressed='true'] { border-color:var(--accent); background:var(--accent-soft); }
.quick button.rec span { color:var(--accent-text); }
.days { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
.days button { width:40px; height:28px; border-radius:var(--r-ctl); border:1px solid var(--border); background:var(--surface-2); color:var(--text-2); font-size:12px; }
.days button[aria-pressed='true'] { background:var(--accent-soft); border-color:var(--accent); color:var(--text-1); font-weight:500; }

/* cards / tiles */
.panel { border:1px solid var(--border); border-radius:var(--r-card); background:var(--surface-1); }
.hero { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)) 1.4fr; gap:0; margin-bottom:24px; }
.hero > div { padding:12px 14px; border-right:1px solid var(--border); min-width:0; }
.hero > div:last-child { border-right:0; }
.stat .k { font-size:12px; color:var(--text-2); }
.stat .v { font-family:var(--font-mono); font-size:24px; font-weight:600; line-height:1.2; margin-top:2px; }
.stat .v small { font-family:var(--font-sans); font-size:13px; font-weight:400; color:var(--text-2); margin-left:2px; }
.spark svg { width:100%; height:48px; display:block; }
.spark .k { font-size:12px; color:var(--text-2); display:flex; justify-content:space-between; }
.links { display:flex; flex-direction:column; border-top:1px solid var(--border); }
.links button { display:flex; align-items:center; gap:10px; text-align:left; padding:9px 2px; border:0; border-bottom:1px solid var(--border); background:none; color:var(--text-1); }
.links button:hover { background:var(--surface-1); }
.links button .w { margin-left:auto; color:var(--text-2); font-size:12px; display:flex; gap:6px; align-items:center; }
.conn { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:4px 14px; align-items:center; padding:12px 14px; border-bottom:1px solid var(--border); }
.conn:last-child { border-bottom:0; }
.conn .ic { width:32px; height:32px; border-radius:var(--r-ctl); display:grid; place-items:center; background:var(--surface-2); border:1px solid var(--border); grid-row:span 2; }
.conn .nm { font-weight:600; font-size:14px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.conn .ds { color:var(--text-2); grid-column:2; }
.conn .ac { grid-row:1 / span 2; grid-column:3; display:flex; gap:6px; }
.steps { counter-reset:st; list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.steps li { counter-increment:st; display:grid; grid-template-columns:24px minmax(0,1fr); gap:10px; align-items:start; }
.steps li::before { content:counter(st); width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-family:var(--font-mono); font-size:12px; border:1px solid var(--border-strong); color:var(--text-2); }
.steps li.done::before { content:'✓'; background:var(--success-soft); border-color:transparent; color:var(--success); }
.code { font-family:var(--font-mono); font-size:12px; padding:8px 10px; border:1px solid var(--border); border-radius:var(--r-ctl); background:var(--surface-2); display:flex; justify-content:space-between; gap:8px; align-items:center; word-break:break-all; }

/* flashcard preview */
.cardlab { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:24px; align-items:start; }
.cardlab > div { min-width:0; }
.flash { border:1px solid var(--border-strong); border-radius:var(--r-flash); background:var(--surface-1); min-height:220px; padding:22px 20px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px; cursor:pointer; position:relative; }
.flash .side { position:absolute; top:8px; left:10px; font-size:11px; color:var(--text-3); }
.flash .fl { position:absolute; top:6px; right:8px; }
.fc-term { font-size:28px; font-weight:600; line-height:1.2; }
.fc-surface { font-size:14px; color:var(--text-2); }
.fc-meaning { font-size:22px; font-weight:600; }
.fc-ex { font-size:14px; line-height:1.5; max-width:34ch; }
.fc-ex i { font-style:normal; color:var(--accent-text); font-weight:600; }
.fc-ex .lb, .fc-src .lb { display:block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-3); margin-bottom:2px; }
.fc-tr { font-size:13px; color:var(--text-2); }
.fc-src { font-size:12px; color:var(--text-2); }
.fc-note { font-size:12px; color:var(--text-2); font-style:italic; }
.fc-shot { width:150px; height:70px; border-radius:6px; background:linear-gradient(160deg,#2a3a2a,#3b2d1c 60%,#1b1b22); border:1px solid var(--border); display:grid; place-items:end center; padding-bottom:6px; color:#f2e9c9; font-size:10px; text-shadow:0 1px 2px #000; }
.fc-audio { display:inline-flex; gap:6px; align-items:center; font-size:12px; color:var(--text-2); border:1px solid var(--border); border-radius:999px; padding:2px 10px; }
.fc-divider { width:60%; border-top:1px dashed var(--border-strong); }
.zones { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.zone { border:1px dashed var(--border-strong); border-radius:var(--r-card); padding:10px; min-height:96px; background:var(--surface-1); }
.zone.over { border-color:var(--accent); background:var(--accent-soft); }
.zone h4 { margin:0 0 8px; font-size:12px; font-weight:600; color:var(--text-2); display:flex; justify-content:space-between; }
.zone .chips { display:flex; flex-wrap:wrap; gap:6px; }
.zone .empty { color:var(--text-3); font-size:12px; }
.chip { white-space:nowrap; display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px; border-radius:var(--r-pill); border:1px solid var(--border-strong); background:var(--surface-2); color:var(--text-1); font-size:12px; font-weight:500; cursor:grab; }
.chip:hover { border-color:var(--accent); }

    case 'relearning_steps': { const st = String(v).trim().split(/\s+/).filter(Boolean); return st.length ? `Unuttuğun kelime ${st.map((x) => `${x} dk`).join(', ')} sonra yeniden gelir.` : 'Unuttuğun kelime yarına planlanır.'; }

/* ================================================================ estimates (prototype model, labelled "tahmin") */
function est(n, r, limit = 1e9) {
  n = Number(n) || 0;
  const k = r <= 0.85 ? 5 : r <= 0.9 ? 7 : 11; // steady reviews per daily new word
  const revAt = (d) => n * k * (1 - Math.exp(-d / 12));
  const minAt = (d) => (n * 25 + Math.min(revAt(d), limit) * 8) / 60;
  const rev30raw = Math.round(revAt(30));
  return { rev30raw, rev30: Math.min(rev30raw, limit), min1: Math.round(minAt(1)), min30: Math.round(minAt(30)), curve: Array.from({ length: 61 }, (_, d) => minAt(d)), month: n * 30 };
}
function nextReminder() {

  if (!days.length) return { warn: true, t: 'Hiçbir gün seçili değil: hatırlatma gelmez.' };
  const [h, m] = S.v['reminders.minute_of_day'].split(':').map(Number);
  const now = new Date();
  for (let i = 0; i < 8; i++) {
    const d = new Date(now); d.setDate(now.getDate() + i); d.setHours(h, m, 0, 0);

    if (days.includes(wd) && d > now) {
      const when = i === 0 ? 'bugün' : i === 1 ? 'yarın' : DAYS_LONG[wd];
      return `Sonraki hatırlatma: ${when} ${S.v['reminders.minute_of_day']} · “Bugün 34 kart seni bekliyor (12 tekrar, 22 yeni).”`;
    }
  }
  return '';
}

/* ---------------------------------------------------------------- chip menu + drag and drop */
let openMenu = null;
function closeMenu() { if (openMenu) { openMenu.el.remove(); openMenu.chip.ariaExpanded = 'false'; const c = openMenu.chip; openMenu = null; return c; } return null; }
function chipMenu(chip) {
  const was = closeMenu(); if (was === chip) return;
  const role = chip.dataset.chip, where = chip.dataset.where;
  const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
  const opts = [];
  if (where !== 'front') opts.push(['front', 'Ön yüze koy (soru)']);
  if (where !== 'back') opts.push(['back', 'Arka yüze koy (cevap)']);
  if (where !== 'pool') opts.push(['pool', 'Kartta gösterme']);
  m.innerHTML = `<div class="mh">${esc(ROLE[role].label)} · ${esc(ROLE[role].d)}</div>` + opts.map(([w, l]) => `<button type="button" role="menuitem" data-mv="${w}">${esc(l)}</button>`).join('') + (where !== 'pool' ? `<hr><button type="button" role="menuitem" data-mv="up">Öne al</button><button type="button" role="menuitem" data-mv="down">Sona al</button>` : '');
  document.body.appendChild(m);
  const r = chip.getBoundingClientRect();
  m.style.left = Math.min(r.left, innerWidth - 210) + 'px'; m.style.top = r.bottom + 4 + scrollY + 'px';
  chip.ariaExpanded = 'true';
  openMenu = { el: m, chip };
  m.addEventListener('click', (e) => { const b = e.target.closest('[data-mv]'); if (!b) return; moveChip(role, b.dataset.mv); });
  m.addEventListener('keydown', (e) => {
    const items = $$('[data-mv]', m), i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    if (e.key === 'Escape') { e.preventDefault(); closeMenu()?.focus(); }
  });
  m.querySelector('button').focus();
}
function moveChip(role, to) {
  const L = S.layout[S.ntType];
  const from = L.front.includes(role) ? 'front' : L.back.includes(role) ? 'back' : 'pool';
  closeMenu();
  if (to === 'up' || to === 'down') { const a = L[from]; a.splice(a.indexOf(role), 1); to === 'up' ? a.unshift(role) : a.push(role); }
  else { if (from !== 'pool') L[from].splice(L[from].indexOf(role), 1); if (to !== 'pool') L[to].push(role); }
  render();
  $(`[data-chip="${role}"]`)?.focus();
}
function wireDnD() {
  $$('.chip[draggable]').forEach((c) => c.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', c.dataset.chip); e.dataTransfer.effectAllowed = 'move'; }));
  $$('[data-zone]').forEach((z) => {
    z.addEventListener('dragover', (e) => { e.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', () => z.classList.remove('over'));
    z.addEventListener('drop', (e) => { e.preventDefault(); z.classList.remove('over'); const r = e.dataTransfer.getData('text/plain'); if (r && ROLE[r]) moveChip(r, z.dataset.zone); });
  });
}

let INDEX = [];
function buildIndex() {
  const rid = (id) => 'row-' + id.replace(/[^a-z0-9]/gi, '-');
  INDEX = [
    ...ALL.map((p) => ({ label: p.title, sub: p.nav, page: p.id, kw: `${p.kw || ''} ${p.nav} ${p.intro}` })),
    ...REG.map((d) => ({ label: d.label, sub: `${pageOf(d.page).nav} › ${d.sec}`, page: d.page, row: rid(d.id), kw: `${d.desc} ${(d.opts || []).map((o) => o[1]).join(' ')}` })),
    ...TEMPO_FIELDS.map((f) => ({ label: f.label, sub: f.basic ? 'Günlük tempo' : `Deste tempoları › ${f.sec}`, page: f.basic ? 'tempo' : 'deck-tempos', row: f.basic ? rid(`tempo.${f.k}@genel`) : null, kw: `${f.desc} ${(f.opts || []).map((o) => o[1]).join(' ')} deste ayarları` })),
    ...EXTRA.map(([label, page, kw, row]) => ({ label, sub: pageOf(page).nav, page, kw, row })),
    ...SHORTCUTS.map(([g, k, l]) => ({ label: l, sub: `Klavye kısayolları › ${g}`, page: 'shortcuts', row: `row-sc-${k}`, kw: `kısayol tuş klavye ${S.shortcuts[k]}` })),
  ].map((x) => ({ ...x, adv: pageOf(x.page).adv, f: fold(`${x.label} ${x.sub} ${x.kw}`), fl: fold(x.label) }));
}
function highlight(label, words) {
  let out = '', map = [], fl = '';
  for (let i = 0; i < label.length; i++) { const f = fold(label[i]); for (let j = 0; j < f.length; j++) map.push(i); fl += f; }
  const hit = new Array(label.length).fill(false);
  for (const w of words) { let p = fl.indexOf(w); while (p >= 0) { for (let j = p; j < p + w.length; j++) hit[map[j]] = true; p = fl.indexOf(w, p + 1); } }
  let open = false;
  for (let i = 0; i < label.length; i++) { if (hit[i] && !open) { out += '<mark>'; open = true; } if (!hit[i] && open) { out += '</mark>'; open = false; } out += esc(label[i]); }
  return out + (open ? '</mark>' : '');
}
let RES = [], act = 0;
function search(q) {

  if (!words.length) { box.hidden = true; box.innerHTML = ''; RES = []; return; }
  RES = INDEX.filter((x) => words.every((w) => x.f.includes(w)))
    .map((x) => ({ ...x, s: (words.every((w) => x.fl.includes(w)) ? 0 : 2) + (x.adv ? 1 : 0) }))
    .sort((a, b) => a.s - b.s || a.label.length - b.label.length).slice(0, 12);
  act = 0;
  box.hidden = false;
  box.innerHTML = RES.length
    ? `<div class="rh">${RES.length} sonuç · ↑↓ ve Enter</div>` + RES.map((r, i) => `<button type="button" class="res${i === act ? ' act' : ''}" role="option" aria-selected="${i === act}" data-res="${i}"><span class="rl">${highlight(r.label, words)}</span><span class="rp">${esc(r.sub)}${r.adv && !S.adv ? '<span class="tag adv">Gelişmiş’te</span>' : ''}</span></button>`).join('')
    : `<div class="rh">Bulunamadı. Başka bir kelime dene: “saat”, “PIN”, “yedek”, “şablon”.</div>`;
}

  if (S.capture) {
    e.preventDefault();
    if (e.key === 'Escape') { const k = S.capture.k; S.capture = null; render(); $(`[data-act="capture"][data-k="${k}"]`)?.focus(); return; }
    if (['Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) return;
    const name = (e.ctrlKey ? 'Ctrl+' : '') + (e.altKey ? 'Alt+' : '') + (e.key === ' ' ? 'Space' : e.key.length === 1 ? e.key.toUpperCase() : e.key);
    const k = S.capture.k, other = Object.entries(S.shortcuts).find(([kk, v]) => v === name && kk !== k);
    if (other) { S.capture = { k, err: `${name} zaten “${SHORTCUTS.find((s) => s[1] === other[0])[2]}” için. Önce onu değiştir ya da başka bir tuş seç.` }; render(); $(`[data-act="capture"][data-k="${k}"]`)?.focus(); return; }
    S.shortcuts[k] = name; S.capture = null; render(); $(`[data-act="capture"][data-k="${k}"]`)?.focus(); toast(`Kaydedildi: ${name}`); buildIndex();
    return;
  }
  if (e.target.id === 'q') {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!RES.length) return; act = (act + (e.key === 'ArrowDown' ? 1 : RES.length - 1)) % RES.length; $$('.res').forEach((b, i) => { b.classList.toggle('act', i === act); b.ariaSelected = String(i === act); }); return; }
    if (e.key === 'Enter') { e.preventDefault(); openResult(act); return; }
    if (e.key === 'Escape') { e.target.value = ''; search(''); return; }
  }
  if (e.key === 'Escape') {
    if (openMenu) { closeMenu()?.focus(); return; }
    if ($('#scrim').classList.contains('open')) { closeDialog(); return; }
    if ($('#drawer').classList.contains('open')) { toggleDrawer(false); return; }
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  const inField = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if (e.key === ' ' && S.page === 'cards' && !inField && (e.target === document.body || e.target.id === 'content' || e.target.classList.contains('flash'))) { e.preventDefault(); ACT.flip(); }
  if (e.key === 'Enter' && e.target.classList?.contains('flash')) { e.preventDefault(); ACT.flip(); }
  if (e.key === 'Enter' && e.target.matches?.('tr[data-act]')) { e.preventDefault(); ACT[e.target.dataset.act](e.target); }
});
$('#scrim').addEventListener('click', (e) => { if (e.target.id === 'scrim') closeDialog(); });
$('#advsw').addEventListener('click', () => setAdv(!S.adv));
$('#qclear').addEventListener('click', () => { $('#q').value = ''; search(''); $('#q').focus(); });

/* ================================================================ prototype strip + notes drawer */
function abSeg(el, opts, val, on) {
  el.innerHTML = opts.map(([v, l]) => `<button type="button" role="radio" aria-checked="${v === val}" data-v="${v}">${l}</button>`).join('');
  el.onclick = (e) => { const b = e.target.closest('[data-v]'); if (b) on(b.dataset.v); };
}
function renderStrip() {
  abSeg($('#ab-nt'), [['A', 'A · kutular'], ['B', 'B · tarifler']], S.nt, (v) => { S.nt = v; store.set('nt', v); renderStrip(); if (S.page !== 'cards') go('cards'); else render(); });
  abSeg($('#ab-deck'), [['A', 'A · tempolar'], ['B', 'B · istisna']], S.deck, (v) => { S.deck = v; store.set('deck', v); renderStrip(); if (S.page !== 'deck-tempos') go('deck-tempos'); else render(); });
  abSeg($('#ab-theme'), [['dark', 'Koyu'], ['light', 'Açık']], S.theme, (v) => { S.theme = v; S.v['app.theme'] = v; store.set('theme', v); applyTheme(); renderStrip(); render(); });
}
function toggleDrawer(open) {
  const d = $('#drawer'); d.classList.toggle('open', open); d.ariaHidden = String(!open);
  $('#notes-top').classList.toggle('on', open);
  if (open) $('#drawer-close').focus(); else $('#notes-top').focus();
}
$('#notes-top').addEventListener('click', () => toggleDrawer(!$('#drawer').classList.contains('open')));
$('#drawer-close').addEventListener('click', () => toggleDrawer(false));

function drawerHTML() {

  <li>Günlük tempo: 5/10/20/30’a bas, süre ve grafik canlı değişir; tekrar sınırını 50 yap, uyarıyı gör.</li>

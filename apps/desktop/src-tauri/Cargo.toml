[package]
name = "fc-desktop"
description = "Flashcard desktop shell (Tauri 2): thin IPC bridge over fc-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "fc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
fc-app.workspace = true
fc-api.workspace = true
fc-core.workspace = true
fc-storage.workspace = true
# OS keychain for AI provider keys (v0.8).
fc-ai = { workspace = true, features = ["keychain"] }
# Native error box for startup failures (release builds on Windows have no console).
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
# Open/save file dialogs for import, export and backups (the backend gets the chosen path).
tauri-plugin-dialog = "2"
# v0.9: one running instance (a second launch forwards its flashcard:// link), the URL
# scheme, the quick-add shortcut, clipboard reads (quick-add prefill, opt-in watcher), and
# the local HTTP API server.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
fc-http = { path = "../../../crates/fc-http" }
# v1.0: signed updates (Ed25519/minisign, public key in tauri.conf.json) and the `log`
# facade whose backend is fc-app's rotating, redacting file log.
tauri-plugin-updater = "2"
log = "0.4"
# v1.0: study reminders (OS notifications) and the local UTC offset they are timed in.
tauri-plugin-notification = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Content the OS marks as private (password managers) is skipped by the clipboard watcher.
[target.'cfg(windows)'.dependencies]
clipboard-win = "5"

[dev-dependencies]
fc-app = { workspace = true, features = ["testing"] }
tempfile.workspace = true

[features]
# Used by `tauri build` / production: serve the bundled frontend.
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true

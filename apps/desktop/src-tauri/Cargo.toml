[package]
name = "fc-desktop"
description = "Flashcard desktop shell (Tauri 2): thin IPC bridge over fc-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "fc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
fc-app.workspace = true
fc-api.workspace = true
fc-core.workspace = true
fc-storage.workspace = true
# Native error box for startup failures (release builds on Windows have no console).
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

[dev-dependencies]
fc-app = { workspace = true, features = ["testing"] }
tempfile.workspace = true

[features]
# Used by `tauri build` / production: serve the bundled frontend.
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true

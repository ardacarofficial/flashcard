name: CI

on:
  push:
    branches: [claude/clever-archimedes-u8c7rp]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  detect:
    name: Hangi parçalar mevcut?
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.d.outputs.rust }}
      types: ${{ steps.d.outputs.types }}
      frontend: ${{ steps.d.outputs.frontend }}
      desktop: ${{ steps.d.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        shell: bash
        run: |
          [ -f Cargo.toml ] && echo "rust=true" >> "$GITHUB_OUTPUT" || echo "rust=false" >> "$GITHUB_OUTPUT"
          [ -f crates/fc-api/Cargo.toml ] && echo "types=true" >> "$GITHUB_OUTPUT" || echo "types=false" >> "$GITHUB_OUTPUT"
          [ -f apps/desktop/package.json ] && [ -f apps/desktop/pnpm-lock.yaml ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"
          [ -f Cargo.toml ] && [ -f apps/desktop/src-tauri/Cargo.toml ] && [ -f apps/desktop/package.json ] && [ -f apps/desktop/pnpm-lock.yaml ] && echo "desktop=true" >> "$GITHUB_OUTPUT" || echo "desktop=false" >> "$GITHUB_OUTPUT"
  rust:
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tauri Linux bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libssl-dev libxdo-dev patchelf build-essential pkg-config
      - uses: dtolnay/rust-toolchain@1.100.0 # = rust-toolchain.toml
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown # example plugins built by the plugin tests
      - uses: Swatinem/rust-cache@v2
      - name: frontendDist klasörü (generate_context! için)
        run: mkdir -p apps/desktop/dist
      - name: Dosya adı / import büyük-küçük harf çakışması (Windows)
        run: node .github/scripts/check-case-collisions.mjs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Real Anki opens our exports (official anki package, isolated venv)
        run: |
          python3 -m venv "$RUNNER_TEMP/ankivenv"
          "$RUNNER_TEMP/ankivenv/bin/pip" install --quiet anki==26.09.4
          FC_ANKI_PYTHON="$RUNNER_TEMP/ankivenv/bin/python" \
            cargo test -p fc-app --locked our_exports_open_in_real_anki -- --ignored
      - name: Plugin SDK (clippy + native tests of the SDK and example plugins)
        run: |
          cargo clippy --manifest-path plugins-sdk/Cargo.toml --workspace --all-targets -- -D warnings
          cargo test --manifest-path plugins-sdk/Cargo.toml --workspace

  types:
    needs: detect
    if: needs.detect.outputs.types == 'true'
    name: TS tipleri güncel mi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0 # = rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: gen-ts --check
        run: cargo run --locked -p fc-api --bin gen-ts -- --check
      - name: Tipleri üret
        run: cargo run --locked -p fc-api --bin gen-ts
      - name: Üretilen klasörde fark yok
        run: |
          dir=apps/desktop/src/lib/api/generated
          git add -N "$dir"
          if ! git diff --exit-code -- "$dir"; then
            echo "::error::Rust DTO'ları değişti ama TS tipleri yeniden üretilmedi. 'cargo run -p fc-api --bin gen-ts' çalıştırıp commit'le."
            exit 1
          fi

  frontend:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    name: Frontend (check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm bundle:check

  screens:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    name: Görsel doğrulama (ekran görüntüleri)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Chromium (playwright-core, pinned)
        run: npx --yes playwright-core@1.56.1 install --with-deps chromium
      - run: pnpm screens
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screens
          path: apps/desktop/screens/
          if-no-files-found: warn
          retention-days: 14

  extension:
    name: Tarayıcı eklentisi (check, test, build, e2e)
    runs-on: ubuntu-24.04  # Playwright has no Chromium build for ubuntu-26.04 yet
    defaults:
      run:
        working-directory: apps/browser-extension
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/browser-extension/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/browser-extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # The real app for `tests/e2e/real-app.spec.ts` (`fc api serve`): without FC_BIN it skips.
      - uses: dtolnay/rust-toolchain@1.100.0 # = rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: fc (CLI) derle
        working-directory: .
        run: cargo build --locked -p fc-cli
      - run: pnpm e2e
        env:
          FC_BIN: ${{ github.workspace }}/target/debug/fc

  windows:
    needs: detect
    if: needs.detect.outputs.desktop == 'true'
    name: Windows (build + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0 # = rust-toolchain.toml
        with:
          targets: wasm32-unknown-unknown # example plugins built by the plugin tests
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Backend testleri (core, storage, app, CLI e2e)
        run: cargo test --locked -p fc-core -p fc-storage -p fc-app -p fc-cli
      - name: Frontend derle
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Frontend build
        working-directory: apps/desktop
        run: pnpm build
      - name: Tauri uygulamasını derle (debug)
        run: cargo build --locked -p fc-desktop

  windows-smoke:
    needs: detect
    if: needs.detect.outputs.desktop == 'true'
    name: Windows (NSIS install + smoke)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0 (= rust-toolchain.toml)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: smoke
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      # Release build of the NSIS installer only; no update signatures in CI (no secret).
      - name: Build the NSIS installer
        working-directory: apps/desktop
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.unsigned.conf.json
      - name: Silent per-user install
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no NSIS installer found" }
          Write-Host "installing $($setup.FullName)"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Flashcard'
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notlike 'uninstall*' } | Select-Object -First 1
          if (-not $exe) { throw "no installed app under $dir (per-user install expected)" }
          "FC_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Launch the installed app with --smoke
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'smoke.txt'
          $p = Start-Process -FilePath $env:FC_EXE -ArgumentList '--smoke', "--smoke-report=$report" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { throw "smoke run exited with $($p.ExitCode)" }
      - name: Silent uninstall
        if: always()
        shell: pwsh
        run: |
          $u = Join-Path $env:LOCALAPPDATA 'Flashcard\uninstall.exe'
          if (Test-Path $u) { Start-Process -FilePath $u -ArgumentList '/S' -Wait }

  core-purity:
    name: fc-core saflık kontrolü
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-core-purity.sh

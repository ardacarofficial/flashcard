name: Release

# v1.0 (track O): a pushed tag `v*` builds the Windows installers (NSIS per-user + MSI),
# signs the update artifacts when the signing secret exists, and creates a DRAFT GitHub
# release with the installers and the update manifest (`latest.json`). Nothing is published
# until a maintainer reviews the draft and clicks "Publish" (the updater only sees published
# releases: `releases/latest/download/latest.json`). See docs/07 §8.
#
# Secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of the private update key (never in the repo)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
# Without them the installers are still built, but without update signatures / latest.json.

on:
  push:
    tags: ['v*']
  # Manual re-run: choose the `v*` tag as the ref in the "Run workflow" dialog; any other ref is skipped.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Windows installers (draft release)
    # workflow_dispatch is only honoured when run from a `v*` tag ref (no branch builds).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
      - name: Tag matches the workspace version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match workspace version $version (Cargo.toml)."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0 (= rust-toolchain.toml)
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      # The frontend is built here, WITHOUT the signing secrets in the environment: build
      # scripts and npm packages never see them. The bundling step below skips its own
      # `beforeBuildCommand` (tauri.prebuilt.conf.json) and gets the secrets alone.
      - name: Build the frontend
        working-directory: apps/desktop
        run: pnpm build
      # v1.3: the installers ship the release `fc` CLI beside the app (Settings › MCP).
      - name: Stage the fc CLI for the bundle
        working-directory: apps/desktop
        run: node scripts/stage-cli.mjs
      - name: Signing key present?
        id: sign
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo 'args=--config src-tauri/tauri.prebuilt.conf.json --config src-tauri/tauri.cli.conf.json' >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without update signatures (no latest.json)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo 'args=--config src-tauri/tauri.prebuilt.conf.json --config src-tauri/tauri.unsigned.conf.json --config src-tauri/tauri.cli.conf.json' >> "$GITHUB_OUTPUT"
          fi
      - name: Build installers and create the draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ steps.sign.outputs.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Flashcard ${{ github.ref_name }}
          releaseBody: |
            ${{ steps.sign.outputs.signed == 'true' && format('Windows installers for Flashcard {0}.', env.VERSION) || format('UNSIGNED — in-app update not available. Windows installers for Flashcard {0} were built without update signatures (no `latest.json`); installed apps will not see this release as an update.', env.VERSION) }}

            * `Flashcard_${{ env.VERSION }}_x64-setup.exe` — recommended (per-user, no admin rights).
            * `Flashcard_${{ env.VERSION }}_x64_en-US.msi` — for managed installs (per-machine).

            The installers are not code-signed: Windows SmartScreen shows "Windows protected
            your PC" → "More info" → "Run anyway" (docs/08 K8).
            ${{ steps.sign.outputs.signed == 'true' && 'Updates inside the app are verified with the project''s Ed25519 update key.' || 'UNSIGNED build: install manually; do not publish this draft as an update.' }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ steps.sign.outputs.signed == 'true' }}
          updaterJsonPreferNsis: true
      - name: The installer contains fc.exe (Settings › MCP needs it)
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no NSIS installer under target/release/bundle/nsis" }
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe' }
          if (-not (Test-Path $sevenZip)) { throw "7-Zip not found: cannot list the installer" }
          $list = & $sevenZip l $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw "7z could not list $($setup.Name)" }
          $list | Write-Host
          $fc = $list | Select-String -Pattern '(^|[\s\\/])fc\.exe$'
          if (-not $fc) { throw "fc.exe is missing from $($setup.Name): do not publish this draft (Settings › MCP needs it)" }
          Write-Host "OK: $($setup.Name) ships $($fc.Line.Trim())"

name: Release

# v1.0 (track O): a pushed tag `v*` builds the Windows installers (NSIS per-user + MSI),
# signs the update artifacts when the signing secret exists, and creates a DRAFT GitHub
# release with the installers and the update manifest (`latest.json`). Nothing is published
# until a maintainer reviews the draft and clicks "Publish" (the updater only sees published
# releases: `releases/latest/download/latest.json`). See docs/07 §8.
#
# Secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of the private update key (never in the repo)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
# Without them the installers are still built, but without update signatures / latest.json.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Windows installers (draft release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Tag matches the workspace version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match workspace version $version (Cargo.toml)."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.100.0 # = rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Signing key present?
        id: sign
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without update signatures (no latest.json)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo 'args=--config src-tauri/tauri.unsigned.conf.json' >> "$GITHUB_OUTPUT"
          fi
      - name: Build installers and create the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ steps.sign.outputs.args }}
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Flashcard ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            Windows installers for Flashcard ${{ env.VERSION }}.

            * `Flashcard_${{ env.VERSION }}_x64-setup.exe` — recommended (per-user, no admin rights).
            * `Flashcard_${{ env.VERSION }}_x64_en-US.msi` — for managed installs (per-machine).

            The installers are not code-signed: Windows SmartScreen shows "Windows protected
            your PC" → "More info" → "Run anyway" (docs/08 K8). Updates inside the app are
            verified with the project's Ed25519 update key.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ steps.sign.outputs.signed == 'true' }}
          updaterJsonPreferNsis: true
